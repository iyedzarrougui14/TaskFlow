<div class="inline-flex overflow-hidden rounded-lg border border-gray-300 bg-white shadow-sm" role="group">
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="cursor-pointer px-4 py-2 text-sm font-medium transition"
      [class]="active() === option.value ? 'bg-blue-600 text-white' : 'text-gray-700 hover:bg-gray-100'"
      [attr.aria-pressed]="active() === option.value"
      (click)="select(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
