<header class="bg-gray-900 text-white shadow">
  <div class="container mx-auto flex items-center justify-between px-6 py-4">
    <h1 class="text-2xl font-bold tracking-tight">
      Task<span class="text-blue-400">Flow</span>
    </h1>
    <p class="hidden text-sm text-gray-400 sm:block">TP 3 : Pipes et Directives</p>
  </div>
</header>

<main class="container mx-auto p-6">
  <div class="mb-6">
    <app-view-toggle [active]="view()" (activeChange)="onViewChange($event)" />
  </div>

  @if (view() === 'tasks') {
    <app-project-list />
  } @else {
    <app-user-list />
  }
</main>
